let currentUser=JSON.parse(localStorage.getItem('shopmix_user')||'null');
let cart=JSON.parse(localStorage.getItem('shopmix_cart')||'[]');
let orders=JSON.parse(localStorage.getItem('shopmix_orders')||'[]');
let chats=JSON.parse(localStorage.getItem('shopmix_chats')||'{}');
let favorites=JSON.parse(localStorage.getItem('shopmix_favorites')||'[]');
const coupons={BEMVINDO10:.10,SHOPMIX20:.20,FRETEGRATIS:0};
let appliedCoupon=null,selectedProduct=null,selectedColor=null,selectedSize=null,quantity=1,galleryIndex=0,activeChatShop=null,selectedPayment='Pix';
function save(){localStorage.setItem('shopmix_user',JSON.stringify(currentUser));localStorage.setItem('shopmix_cart',JSON.stringify(cart));localStorage.setItem('shopmix_orders',JSON.stringify(orders));localStorage.setItem('shopmix_chats',JSON.stringify(chats));localStorage.setItem('shopmix_favorites',JSON.stringify(favorites));updateHeader()}
function money(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function updateHeader(){document.getElementById('cartCount').textContent=cart.reduce((a,b)=>a+b.qty,0);document.getElementById('accountLabel').textContent=currentUser?(currentUser.name||'Conta').split(' ')[0]:'Entrar'}
function go(route,arg){window.scrollTo(0,0);document.getElementById('suggestions').classList.add('hidden');if(route==='home')renderHome();else if(route==='product')renderProduct(Number(arg));else if(route==='cart')renderCart();else if(route==='checkout')renderCheckout();else if(route==='auth')renderAuth();else if(route==='account')renderAccount();else if(route==='messages')renderMessages(arg);else if(route==='search')renderSearch(arg||'');else if(route==='orders')renderOrders()}
function imgTag(src,alt='Produto'){const safe=String(src||'').replace(/'/g,'%27');return `<img src="${safe}" alt="${alt}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/700x700/f4f4f4/555?text='+encodeURIComponent('${String(alt).replace(/'/g,'')}');">`}
function productCard(p){const fav=favorites.includes(p.id);const discount=Math.max(1,Math.round((1-p.price/p.old)*100));return `<article class="product" onclick="go('product',${p.id})"><span class="badge">-${discount}%</span><button class="favorite" onclick="event.stopPropagation();toggleFavorite(${p.id})">${fav?'❤️':'♡'}</button><div class="pimg">${imgTag(p.imgs[0],p.name)}</div><div class="pinfo"><h3>${p.name}</h3><div class="price">${money(p.price)}</div><div class="old">${money(p.old)}</div><div class="price-note">Oferta • preço promocional</div><div class="rating">★★★★★ ${p.rating} • ${p.sold} vendidos</div><div class="ship">Frete grátis</div></div></article>`}
function startCountdown(){let el=document.getElementById('countdown');if(!el)return;if(window.shopmixTimer)clearInterval(window.shopmixTimer);let end=Date.now()+3*60*60*1000;const tick=()=>{let left=Math.max(0,end-Date.now()),sec=Math.floor(left/1000),h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor(sec%3600/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');if(el)el.textContent=`${h}:${m}:${s}`;};tick();window.shopmixTimer=setInterval(tick,1000)}
function hideSplash(){const x=document.getElementById('splash');if(x)x.classList.add('hide')}
function colorFilter(c){const x=(c||'').toLowerCase();if(x.includes('preto')||x.includes('preta'))return 'grayscale(1) brightness(.42) contrast(1.15)';if(x.includes('branco')||x.includes('branca'))return 'grayscale(1) brightness(1.65) contrast(.78)';if(x.includes('azul escuro'))return 'saturate(1.55) brightness(.62) hue-rotate(2deg)';if(x.includes('azul'))return 'saturate(.9) brightness(1.18) hue-rotate(4deg)';if(x.includes('vermelho')||x.includes('vermelha'))return 'saturate(1.8) hue-rotate(-18deg) brightness(1.02)';if(x.includes('verde'))return 'saturate(1.45) hue-rotate(62deg) brightness(.98)';if(x.includes('rosa')||x.includes('rosé'))return 'saturate(1.45) hue-rotate(295deg) brightness(1.08)';if(x.includes('dourado'))return 'saturate(1.35) sepia(.55) hue-rotate(350deg) brightness(1.05)';if(x.includes('prateado')||x.includes('prata')||x.includes('inox'))return 'grayscale(.7) brightness(1.2) contrast(.9)';if(x.includes('marrom')||x.includes('bege')||x.includes('nude'))return 'sepia(.45) saturate(.75) brightness(1.05)';return 'none'}
function reviewHighlights(p){
 const cat=p.cat;
 if(cat==='Moda') return ['Tamanho fiel','Caimento bonito','Foto fiel ao produto','Material aprovado'];
 if(cat==='Joias'||cat==='Acessórios') return ['Acabamento bonito','Foto fiel ao produto','Boa qualidade','Tamanho conforme anúncio'];
 if(cat==='Eletrônicos'||cat==='Eletrodomésticos') return ['Produto conforme anúncio','Bem embalado','Boa qualidade','Entrega rápida'];
 if(cat==='Casa') return ['Material bom','Tamanho conforme anúncio','Foto fiel ao produto','Boa qualidade'];
 return ['Foto fiel ao produto','Boa qualidade','Compra aprovada','Entrega rápida'];
}
function galleryViews(p){const base=p.imgs[0];return [{src:base,label:'Frente'},{src:base+'&crop=entropy&fit=crop&w=1100&q=78',label:'Detalhe'},{src:base+'&crop=faces&fit=crop&w=1100&q=78',label:'Zoom'}]}
function renderProduct(id){selectedProduct=PRODUCTS.find(p=>p.id===id);if(!selectedProduct){go('home');return}selectedColor=selectedProduct.colors[0];selectedSize=selectedProduct.sizes[0];quantity=1;galleryIndex=0;const p=selectedProduct,views=galleryViews(p),chips=reviewHighlights(p),discount=Math.max(1,Math.round((1-p.price/p.old)*100));document.getElementById('screen').innerHTML=`<div class="product-page"><button class="btn gray" onclick="go('home')">← Voltar</button><div class="detail" style="margin-top:12px"><div><div class="gallery-main" id="mainGallery"></div><div class="thumbs">${views.map((v,i)=>`<div class="thumb ${i===0?'active':''}" onclick="setGallery(${i})">${imgTag(v.src,p.name)}</div>`).join('')}</div><div class="gallery-controls"><span>↔ Visualizações do produto</span><span id="viewName">Frente</span></div></div><div><h1>${p.name}</h1><div class="rating">★★★★★ ${p.rating} • ${p.sold} vendidos</div><div class="detail-price">${money(p.price)}</div><div class="old">${money(p.old)} • ${discount}% OFF</div><div class="price-note">🔥 Oferta por tempo limitado • preço promocional</div><div class="review-highlights">${chips.map(c=>`<span class="review-chip">✓ ${c}</span>`).join('')}</div><div class="review-box"><div class="review-score"><b>${p.rating}</b><span><span class="review-stars">★★★★★</span><br><small>avaliações verificadas</small></span></div><strong>O que compradores destacam</strong><p style="margin:7px 0 0;color:#666;font-size:13px">“${chips[0]}” e “${chips[1]}” aparecem entre os destaques desta categoria.</p></div><div class="option"><label>Cor: <span id="chosenColor">${selectedColor}</span></label><div class="options">${p.colors.map(c=>`<button class="opt color-opt ${c===selectedColor?'selected':''}" onclick="chooseColor(${JSON.stringify(c)})"><span class="color-dot" style="background:${colorSwatch(c)}"></span>${c}</button>`).join('')}</div><small class="color-preview-note">Selecione uma cor para atualizar a visualização.</small></div><div class="option"><label>Tamanho / opção: <span id="chosenSize">${selectedSize}</span></label><div class="options">${p.sizes.map(s=>`<button class="opt ${s===selectedSize?'selected':''}" onclick="chooseSize(${JSON.stringify(s)})">${s}</button>`).join('')}</div></div><div class="option"><label>Quantidade</label><div class="qty"><button onclick="changeQty(-1)">−</button><input id="qty" value="1" readonly><button onclick="changeQty(1)">+</button></div></div><div class="actions"><button class="btn gray" onclick="addSelected(false)">🛒 Adicionar ao carrinho</button><button class="btn" onclick="addSelected(true)">Comprar agora</button></div><div class="secure">✓ Compra protegida • ✓ Devolução conforme política da loja</div></div></div><div class="store"><div><div class="store-name">🏪 ${p.shop}</div><small>Loja verificada • Responde rapidamente</small></div><button class="btn gray" onclick="openShopChat('${p.shop}')">💬 Falar com a loja</button></div></div>`;setGallery(0)}
function setGallery(i){galleryIndex=i;const p=selectedProduct,el=document.getElementById('mainGallery');if(!el)return;const views=galleryViews(p),v=views[i]||views[0];el.innerHTML=imgTag(v.src,p.name)+`<span class="view-label">${v.label}</span>`;const img=el.querySelector('img');if(img&&p.visualColors)img.style.filter=colorFilter(selectedColor);document.querySelectorAll('.thumb').forEach((x,j)=>x.classList.toggle('active',j===i));const vn=document.getElementById('viewName');if(vn)vn.textContent=v.label}
function chooseColor(c){selectedColor=c;document.getElementById('chosenColor').textContent=c;document.querySelectorAll('.option')[0].querySelectorAll('.opt').forEach(b=>b.classList.toggle('selected',b.textContent.trim()===c));setGallery(galleryIndex)}
function chooseSize(s){selectedSize=s;document.getElementById('chosenSize').textContent=s;document.querySelectorAll('.option')[1].querySelectorAll('.opt').forEach(b=>b.classList.toggle('selected',b.textContent.trim()===s))}
function changeQty(n){quantity=Math.max(1,quantity+n);document.getElementById('qty').value=quantity}
function addSelected(buy){const p=selectedProduct,key=`${p.id}-${selectedColor}-${selectedSize}`;const item=cart.find(x=>x.key===key);if(item)item.qty+=quantity;else cart.push({key,id:p.id,name:p.name,price:p.price,emoji:p.emoji,img:p.imgs[0],shop:p.shop,color:selectedColor,size:selectedSize,qty:quantity});save();toast('Produto adicionado ao carrinho');if(buy)go('checkout')}
function renderCart(){if(!cart.length){document.getElementById('screen').innerHTML=`<div class="page"><div class="card empty"><div style="font-size:60px">🛒</div><h2>Seu carrinho está vazio</h2><p>Encontre produtos e adicione seus favoritos.</p><button class="btn" onclick="go('home')">Continuar comprando</button></div></div>`;return}const subtotal=cart.reduce((a,b)=>a+b.price*b.qty,0),discount=appliedCoupon&&coupons[appliedCoupon]?subtotal*coupons[appliedCoupon]:0;document.getElementById('screen').innerHTML=`<div class="page"><button class="btn gray" onclick="go('home')">← Continuar comprando</button><h1>Meu carrinho</h1><div class="card">${cart.map((x,i)=>`<div class="cart-row"><div class="mini-img">${imgTag(x.img,x.name)}</div><div><b>${x.name}</b><div class="row-option">Cor: ${x.color} • Opção: ${x.size}</div><small>${x.shop}</small></div><div class="qty cart-actions"><button onclick="cartQty(${i},-1)">−</button><input value="${x.qty}" readonly><button onclick="cartQty(${i},1)">+</button></div><div class="row-total">${money(x.price*x.qty)}</div><button class="btn gray remove" onclick="removeCart(${i})">Excluir</button></div>`).join('')}</div><div class="card"><div class="summary"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="coupon"><input id="couponInput" placeholder="Código do cupom"><button class="btn" onclick="applyCoupon()">Aplicar</button></div><div id="couponMsg" class="coupon-msg"></div>${discount?`<p>Desconto atual: <b style="color:#008a4a">-${money(discount)}</b></p>`:''}<button class="btn" style="width:100%;margin-top:15px" onclick="go(currentUser?'checkout':'auth')">Continuar para compra</button></div></div>`}
function cartQty(i,n){cart[i].qty=Math.max(1,cart[i].qty+n);save();renderCart()}
function removeCart(i){cart.splice(i,1);save();renderCart();toast('Produto removido')}
function applyCoupon(){const c=document.getElementById('couponInput').value.trim().toUpperCase();const msg=document.getElementById('couponMsg');if(coupons[c]!==undefined){appliedCoupon=c;msg.textContent=c==='FRETEGRATIS'?'Cupom aplicado: frete grátis!':`Cupom aplicado: ${coupons[c]*100}% de desconto.`;msg.style.color='#008a4a'}else{appliedCoupon=null;msg.textContent='Cupom inválido.';msg.style.color='#c00'}}
function renderCheckout(){if(!currentUser){go('auth');return}if(!cart.length){go('cart');return}const subtotal=cart.reduce((a,b)=>a+b.price*b.qty,0),discount=appliedCoupon&&coupons[appliedCoupon]?subtotal*coupons[appliedCoupon]:0,total=subtotal-discount;document.getElementById('screen').innerHTML=`<div class="page"><button class="btn gray" onclick="go('cart')">← Carrinho</button><h1>Finalizar compra</h1><div class="checkout-grid"><div><div class="card"><h3>📍 Endereço de entrega</h3><div class="address selected"><b>${currentUser.name}</b><br>${currentUser.address||'Rua Principal, 100'}<br>${currentUser.city||'Goiânia - GO'}<br>CEP: ${currentUser.cep||'74000-000'}</div></div><div class="card"><h3>💳 Forma de pagamento</h3>${['Pix','Cartão de crédito','Boleto'].map(p=>`<div class="pay-option ${selectedPayment===p?'selected':''}" onclick="selectPayment('${p}')">${p==='Pix'?'💠':p==='Cartão de crédito'?'💳':'💵'} ${p}</div>`).join('')}</div><div class="card"><h3>🛍️ Produtos</h3>${cart.map(x=>`<p>${x.qty}x ${x.name} — ${money(x.price*x.qty)}</p>`).join('')}</div></div><div class="card"><h2>Resumo</h2><p>Subtotal: ${money(subtotal)}</p><p>Desconto: -${money(discount)}</p><p>Frete: <b>Grátis</b></p><hr><div class="summary"><span>Total</span><b>${money(total)}</b></div><button class="btn" style="width:100%;margin-top:18px" onclick="placeOrder()">Finalizar pedido</button><div class="secure">Pagamento protegido neste protótipo</div></div></div></div>`}
function selectPayment(p){selectedPayment=p;renderCheckout()}
function placeOrder(){const order={id:'SM'+Date.now().toString().slice(-8),date:new Date().toLocaleString('pt-BR'),items:cart.map(x=>({...x})),status:'Pedido confirmado',payment:selectedPayment};orders.unshift(order);cart=[];appliedCoupon=null;save();toast('Pedido realizado com sucesso!');setTimeout(()=>go('orders'),500)}
function renderAuth(){document.getElementById('screen').innerHTML=`<div class="auth-wrap"><div class="auth-card"><div class="tabs"><button id="loginTab" class="active" onclick="authMode('login')">Entrar</button><button id="registerTab" onclick="authMode('register')">Criar conta</button></div><div id="authForm"></div></div></div>`;authMode('login')}
function authMode(mode){document.getElementById('loginTab').classList.toggle('active',mode==='login');document.getElementById('registerTab').classList.toggle('active',mode==='register');document.getElementById('authForm').innerHTML=mode==='login'?`<h1>ShopMix</h1><p style="text-align:center">Entre na sua conta</p><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="pass" type="password" onkeydown="if(event.key==='Enter')login()"></div><button class="btn" style="width:100%" onclick="login()">Entrar</button><p style="font-size:12px;color:#777">Se ainda não possui conta, use “Criar conta”.</p>`:`<h1>Criar conta</h1><div class="field"><label>Nome</label><input id="name"></div><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="pass" type="password"></div><div class="field"><label>Endereço</label><input id="address" placeholder="Rua, número"></div><div class="field"><label>Cidade</label><input id="city" placeholder="Goiânia - GO"></div><div class="field"><label>CEP</label><input id="cep"></div><button class="btn" style="width:100%" onclick="register()">Criar conta</button>`}
function register(){const u={name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),pass:document.getElementById('pass').value,address:document.getElementById('address').value,city:document.getElementById('city').value,cep:document.getElementById('cep').value};if(!u.name||!u.email||!u.pass){toast('Preencha nome, e-mail e senha');return}localStorage.setItem('shopmix_account',JSON.stringify(u));currentUser=u;save();toast('Conta criada!');go('home')}
function login(){const u=JSON.parse(localStorage.getItem('shopmix_account')||'null'),email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;if(!u||u.email!==email||u.pass!==pass){toast('E-mail ou senha incorretos');return}currentUser=u;save();go('home')}
function logout(){currentUser=null;save();toast('Sessão encerrada');go('home')}
function renderAccount(){if(!currentUser){go('auth');return}document.getElementById('screen').innerHTML=`<div class="page"><div class="card"><h1>Olá, ${(currentUser.name||'Cliente').split(' ')[0]}! 👋</h1><p>${currentUser.email}</p></div><div class="account-menu"><div class="menu-card" onclick="go('orders')"><div class="menu-icon">📦</div><b>Meus pedidos</b><small>Acompanhe suas compras</small></div><div class="menu-card" onclick="go('messages')"><div class="menu-icon">💬</div><b>Mensagens</b><small>Fale com as lojas</small></div><div class="menu-card" onclick="go('cart')"><div class="menu-icon">🛒</div><b>Meu carrinho</b><small>${cart.reduce((a,b)=>a+b.qty,0)} itens</small></div><div class="menu-card" onclick="editProfile()"><div class="menu-icon">👤</div><b>Minha conta</b><small>Editar dados</small></div><div class="menu-card" onclick="showFavorites()"><div class="menu-icon">❤️</div><b>Favoritos</b><small>${favorites.length} produtos salvos</small></div><div class="menu-card" onclick="logout()"><div class="menu-icon">🚪</div><b>Sair</b><small>Encerrar sessão</small></div></div></div>`}
function editProfile(){if(!currentUser)return;const n=prompt('Nome:',currentUser.name);if(n!==null&&n.trim()){currentUser.name=n.trim();save();renderAccount();toast('Nome atualizado')}}
function showFavorites(){const ps=PRODUCTS.filter(p=>favorites.includes(p.id));document.getElementById('screen').innerHTML=`<div class="page"><button class="btn gray" onclick="go('account')">← Minha conta</button><h1>Favoritos</h1>${ps.length?`<div class="grid">${ps.map(productCard).join('')}</div>`:`<div class="card empty">Você ainda não salvou produtos.</div>`}</div>`}
function toggleFavorite(id){if(favorites.includes(id))favorites=favorites.filter(x=>x!==id);else favorites.push(id);save();toast(favorites.includes(id)?'Adicionado aos favoritos':'Removido dos favoritos');const current=document.getElementById('screen');if(current&&current.querySelector('.grid')){if(document.querySelector('.product')){renderHome()}}}
function colorSwatch(c){const x=(c||'').toLowerCase();if(x.includes('preto')||x.includes('preta'))return '#171717';if(x.includes('branco')||x.includes('branca'))return '#f5f5f5';if(x.includes('azul'))return '#3b82f6';if(x.includes('vermelho')||x.includes('vermelha'))return '#d92d20';if(x.includes('verde'))return '#3f8f55';if(x.includes('rosa')||x.includes('rosé'))return '#e9a7bd';if(x.includes('dourado'))return '#d4a72c';if(x.includes('prateado')||x.includes('prata')||x.includes('inox'))return '#bfc5cc';if(x.includes('marrom'))return '#795548';if(x.includes('bege')||x.includes('nude'))return '#d7b58c';if(x.includes('grafite'))return '#4b5563';if(x.includes('natural'))return '#c8a27a';if(x.includes('floral'))return 'linear-gradient(135deg,#f4b1b1,#f8d77e)';return '#ddd'}

/* As fotos dos produtos são as URLs de fotos já cadastradas em cada item de PRODUCTS. */

function renderHome(){
 const cats=['Todos','Eletrônicos','Moda','Joias','Casa','Eletrodomésticos','Beleza','Acessórios','Games','Livros'];
 const flash=PRODUCTS.filter(p=>[3,4,6,9,14,23].includes(p.id));
 const featured=PRODUCTS.slice(0,12);
 document.getElementById('screen').innerHTML=`
 <div class="home-wrap">
   <div class="home-banners">
     <section class="hero"><div><div style="font-size:13px;font-weight:800;opacity:.9">SHOPMIX • OFERTAS DE HOJE</div><h1>Tudo o que você procura em um só lugar.</h1><p>Moda, joias, eletrônicos, casa e muito mais com ofertas todos os dias.</p><button class="btn light" onclick="document.getElementById('productsSection').scrollIntoView({behavior:'smooth'})">Ver produtos</button></div></section>
     <div class="side-promos"><div class="promo one" onclick="renderSearch('Moda')"><strong>Moda feminina</strong><small>Vestidos, bolsas, tênis e muito mais</small></div><div class="promo two" onclick="renderSearch('Joias')"><strong>Joias e acessórios</strong><small>Brincos, colares, pulseiras e relógios</small></div></div>
   </div>
   <div class="quick-links">
     <div class="quick-card" onclick="renderSearch('Eletrônicos')"><div class="quick-icon">📱</div><b>Eletrônicos</b></div>
     <div class="quick-card" onclick="renderSearch('Moda')"><div class="quick-icon">👗</div><b>Moda</b></div>
     <div class="quick-card" onclick="renderSearch('Joias')"><div class="quick-icon">💎</div><b>Joias</b></div>
     <div class="quick-card" onclick="renderSearch('Casa')"><div class="quick-icon">🏠</div><b>Casa</b></div>
     <div class="quick-card" onclick="renderSearch('Eletrodomésticos')"><div class="quick-icon">🧺</div><b>Eletrodomésticos</b></div>
     <div class="quick-card" onclick="go('cart')"><div class="quick-icon">🛒</div><b>Meu carrinho</b></div>
   </div>
   <div class="section-strip"><div class="chips">${cats.map(c=>`<button class="chip" onclick="${c==='Todos'?'go(\'home\')':`renderSearch('${c}')`}">${c}</button>`).join('')}</div></div>
   <section class="flash"><div class="flash-head"><div><div class="flash-title">🔥 Oferta relâmpago</div><small>Descontos selecionados por tempo limitado</small></div><span id="countdown" class="countdown">03:00:00</span></div><div class="flash-grid">${flash.map(p=>`<div class="flash-item" onclick="go('product',${p.id})">${imgTag(p.imgs[0],p.name)}<div><b>${money(p.price)}</b><s>${money(p.old)}</s><small>-${Math.round((1-p.price/p.old)*100)}% OFF</small></div></div>`).join('')}</div></section>
   <section class="section-strip"><h2>Por que comprar na ShopMix?</h2><div class="benefits"><div class="benefit"><span>🚚</span><div><b>Frete grátis</b><small>Em produtos selecionados</small></div></div><div class="benefit"><span>🛡️</span><div><b>Compra protegida</b><small>Mais segurança no pedido</small></div></div><div class="benefit"><span>⭐</span><div><b>Avaliações reais</b><small>Veja o que compradores destacam</small></div></div><div class="benefit"><span>💬</span><div><b>Fale com a loja</b><small>Atendimento pelo aplicativo</small></div></div></div></section>
   <section id="productsSection"><div class="section-title"><h2>Produtos em destaque</h2><button class="btn gray" onclick="go('search')">Ver todos</button></div><div class="grid">${featured.map(productCard).join('')}</div></section>
   <section><div class="section-title"><h2>Mais produtos para você</h2></div><div class="grid">${PRODUCTS.slice(12).map(productCard).join('')}</div></section>
   <section class="section-strip"><h2>Lojas em destaque</h2><div class="shops">${[...new Set(PRODUCTS.map(p=>p.shop))].slice(0,4).map((s,i)=>`<div class="shop-card" onclick="renderSearch('${s}')"><div class="shop-avatar">${['🏪','💄','👗','🎮'][i]||'🏪'}</div><b>${s}</b><small>Loja verificada • ${PRODUCTS.filter(p=>p.shop===s).length} produtos</small></div>`).join('')}</div></section>
   <footer class="footer-main"><div class="footer-cols"><div><h4>ShopMix</h4><p>Marketplace com produtos para toda a família.</p></div><div><h4>Ajuda</h4><p>Central de ajuda</p><p>Pedidos e entregas</p><p>Trocas e devoluções</p></div><div><h4>Comprar</h4><p>Ofertas do dia</p><p>Mais vendidos</p><p>Favoritos</p></div><div><h4>Atendimento</h4><p>Mensagens</p><p>Fale com as lojas</p><p>Compra protegida</p></div></div><div class="footer-bottom">© 2026 ShopMix • Protótipo de marketplace</div></footer>
 </div>`;
 startCountdown();
}

function renderOrders(){if(!currentUser){go('auth');return}document.getElementById('screen').innerHTML=`<div class="page"><button class="btn gray" onclick="go('account')">← Minha conta</button><h1>Meus pedidos</h1>${orders.length?orders.map(o=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><b>Pedido ${o.id}</b><span class="order-status">${o.status}</span></div><small>${o.date} • ${o.payment||'Pix'}</small>${o.items.map(x=>`<div class="cart-row"><div class="mini-img">${imgTag(x.img,x.name)}</div><div><b>${x.name}</b><br><small>Cor: ${x.color} • Opção: ${x.size}<br>Loja: ${x.shop}</small></div><div>${x.qty}x</div><button class="btn gray" onclick="openShopChat('${x.shop}')">💬 Mensagem</button></div>`).join('')}</div>`).join(''):`<div class="card empty"><div style="font-size:55px">📦</div><h2>Você ainda não fez pedidos</h2><button class="btn" onclick="go('home')">Comprar agora</button></div>`}</div>`}
function renderSearch(term=''){const q=term.trim().toLowerCase();const result=PRODUCTS.filter(p=>!q||[p.name,p.cat,p.shop].join(' ').toLowerCase().includes(q));document.getElementById('screen').innerHTML=`<div class="page"><div class="search-head"><div><h1>Pesquisar produtos</h1><p>${q?`Resultados para “${term}”`:'Todos os produtos'}</p></div><button class="btn gray" onclick="go('home')">Início</button></div><div class="grid result-grid">${result.length?result.map(productCard).join(''):`<div class="card empty" style="grid-column:1/-1">Nenhum produto encontrado.<br><button class="btn" style="margin-top:12px" onclick="go('home')">Voltar à loja</button></div>`}</div></div>`}
function searchProducts(){const q=document.getElementById('searchInput').value;renderSearch(q);document.getElementById('suggestions').classList.add('hidden')}
function showSuggestions(value){const q=value.trim().toLowerCase(),box=document.getElementById('suggestions');if(!q){box.classList.add('hidden');return}const r=PRODUCTS.filter(p=>p.name.toLowerCase().includes(q)).slice(0,5);box.innerHTML=r.map(p=>`<div onclick="document.getElementById('searchInput').value='${p.name}';searchProducts()">${p.emoji} ${p.name}</div>`).join('');box.classList.toggle('hidden',!r.length)}
function renderMessages(shop){activeChatShop=shop||activeChatShop||Object.keys(chats)[0]||'Tech Mundo';const shops=[...new Set(PRODUCTS.map(p=>p.shop))];if(!chats[activeChatShop])chats[activeChatShop]=[{from:'shop',text:'Olá! Como podemos ajudar?'}];document.getElementById('screen').innerHTML=`<div class="page"><h1>Mensagens</h1><div class="message-layout"><div class="threads">${shops.map(s=>`<div class="thread ${s===activeChatShop?'active':''}" onclick="renderMessages('${s}')"><b>🏪 ${s}</b><br><small>Atendimento da loja</small></div>`).join('')}</div><div class="chat"><div class="chat-head">${activeChatShop}</div><div class="chat-body" id="chatBody">${chats[activeChatShop].map(m=>`<div class="bubble ${m.from==='me'?'me':'shop'}">${m.text}</div>`).join('')}</div><div class="chat-input"><input id="chatText" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="btn" onclick="sendMessage()">Enviar</button></div></div></div></div>`;setTimeout(()=>{const b=document.getElementById('chatBody');if(b)b.scrollTop=b.scrollHeight},0)}
function sendMessage(){const input=document.getElementById('chatText'),text=input.value.trim();if(!text)return;if(!chats[activeChatShop])chats[activeChatShop]=[];chats[activeChatShop].push({from:'me',text});save();renderMessages(activeChatShop);setTimeout(()=>{chats[activeChatShop].push({from:'shop',text:'Mensagem recebida! Em breve a loja responderá.'});save();renderMessages(activeChatShop)},600)}
function openShopChat(shop){activeChatShop=shop;go('messages',shop)}
let cameraStream=null,capturedPhoto=null;
function openCamera(){
 document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box"><h2>Buscar por imagem 📷</h2><p class="camera-hint">Aponte a câmera para o produto e toque em “Tirar foto”. Se a câmera não abrir, use “Escolher foto”.</p><video id="cameraVideo" class="camera-video" autoplay playsinline></video><canvas id="cameraCanvas" class="hidden"></canvas><img id="cameraPreview" class="camera-preview hidden" alt="Foto capturada"><div class="camera-actions"><button class="btn" onclick="takePhoto()">📸 Tirar foto</button><button class="btn gray" onclick="choosePhoto()">🖼️ Escolher foto</button><button class="btn gray" onclick="closeModal()">Fechar</button></div><input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden" onchange="previewPhoto(event)"><div id="cameraStatus" class="camera-hint" style="margin-top:10px"></div></div></div>`;
 const video=document.getElementById('cameraVideo');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){document.getElementById('cameraStatus').textContent='A câmera direta não está disponível neste arquivo. Use “Escolher foto”.';return}
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(stream=>{cameraStream=stream;video.srcObject=stream;document.getElementById('cameraStatus').textContent='Câmera pronta. Aponte para o produto e toque em “Tirar foto”.'}).catch(()=>{document.getElementById('cameraStatus').textContent='Permissão de câmera bloqueada. Toque em “Escolher foto” para tirar/selecionar uma foto.'});
}
function takePhoto(){const video=document.getElementById('cameraVideo'),canvas=document.getElementById('cameraCanvas'),preview=document.getElementById('cameraPreview');if(!video||!video.videoWidth){toast('A câmera ainda não está pronta');return}canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);capturedPhoto=canvas.toDataURL('image/jpeg',0.78);preview.src=capturedPhoto;preview.classList.remove('hidden');document.getElementById('cameraStatus').textContent='Foto tirada! Você pode tirar outra ou fechar a janela.'}
function choosePhoto(){document.getElementById('photoInput')?.click()}
function previewPhoto(event){const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{capturedPhoto=reader.result;const p=document.getElementById('cameraPreview');p.src=capturedPhoto;p.classList.remove('hidden');const st=document.getElementById('cameraStatus');if(st)st.textContent='Foto carregada com sucesso.'};reader.readAsDataURL(file)}
function closeModal(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}document.getElementById('modalRoot').innerHTML='';capturedPhoto=null}
window.addEventListener('storage',updateHeader);renderHome();updateHeader();
document.addEventListener('DOMContentLoaded',()=>{go('home');setTimeout(hideSplash,1500)});
</script>
